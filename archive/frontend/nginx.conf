server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://app:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /readyz {
        proxy_pass http://app:8000/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        # Report generation and large exports are synchronous today. Keep the
        # gateway from returning a false 504 before the API can publish its
        # atomic result; production should still move generation to a job.
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BrowserRouter needs the entry document for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
